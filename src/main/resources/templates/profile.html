<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Profile')}"></head><body><div class="shell">
<aside th:replace="~{fragments/layout :: sidebar('profile')}"></aside><main class="main"><div class="top"><div><button class="btn menu-btn">&#9776;</button><h1>Profile &amp; Settings</h1><span style="color:var(--muted)">Keep your information and security up to date.</span></div></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<form class="card" th:action="@{/profile}" method="post"><h3>Personal &amp; organization information</h3><div class="form2">
<div><label>Full name</label><input name="name" th:value="${user.name}" required></div><div><label>Email address</label><input th:value="${user.email}" disabled></div>
<div><label>Phone number</label><input name="phone" th:value="${user.phone}" required></div><div><label>Role</label><input th:value="${#strings.toLowerCase(user.role)}" disabled></div>
<div><label>Organization name</label><input name="orgName" th:value="${user.orgName}"></div><div><label>Location</label><input name="location" th:value="${user.location}" required></div></div><br><button class="btn btn-green">Save Changes</button></form><br>
<form class="card" th:action="@{/profile/password}" method="post"><h3>Password &amp; security</h3><div class="form2"><div><label>Current password</label><input type="password" name="current" required></div><div><label>New password (min 8)</label><input type="password" name="next" required minlength="8"></div></div><br><button class="btn">Change password</button></form></main></div></body></html>
