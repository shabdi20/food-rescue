<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Dashboard')}"></head><body><div class="shell">
<aside th:replace="~{fragments/layout :: sidebar('dash')}"></aside><main class="main">
<div class="top"><div><button class="btn menu-btn">&#9776;</button><h1>Welcome back, <span th:text="${user.name}"></span></h1><span style="color:var(--muted)">Help turn today's surplus into meaningful local impact.</span></div><a th:href="@{/donor/donations/new}" class="btn btn-green">+ Add Food Donation</a></div>
<div class="grid g4"><div class="card stat"><span>Active donations</span><b th:text="${active}"></b></div><div class="card stat"><span>Pending requests</span><b th:text="${requests.size()}"></b></div><div class="card stat"><span>Completed donations</span><b th:text="${done}"></b></div><div class="card stat"><span>Total listings</span><b th:text="${donations.size()}"></b></div></div><br>
<div class="card"><h3>Recent donations</h3><div class="tablewrap"><table><tr><th>Donation</th><th>Quantity</th><th>Pickup deadline</th><th>Status</th></tr>
<tr th:each="d:${donations}"><td th:text="${d.foodName}"></td><td th:text="${d.quantity+' '+d.unit}"></td><td th:text="${#temporals.format(d.bestBefore,'dd MMM, hh:mm a')}"></td><td><span th:replace="~{fragments/layout :: badge(${d.status.name()})}"></span></td></tr></table></div></div>
<br><div class="card"><h3>Latest requests <a th:href="@{/donor/requests}" style="float:right;font-size:13px;color:var(--green)">Manage requests</a></h3><p th:if="${requests.empty}">No requests yet.</p><div th:each="r:${requests}" style="padding:8px 0;border-top:1px solid var(--line)"><b th:text="${r.organization.organizationName}"></b> requested <span th:text="${r.donation.foodName}"></span> <span th:replace="~{fragments/layout :: badge(${r.status.name()})}"></span></div></div>
</main></div></body></html>
