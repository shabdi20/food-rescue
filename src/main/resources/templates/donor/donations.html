<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('My Donations')}"></head><body><div class="shell">
<aside th:replace="~{fragments/layout :: sidebar('mine')}"></aside><main class="main"><div class="top"><div><button class="btn menu-btn">&#9776;</button><h1>My Donations</h1><span style="color:var(--muted)">Manage every listing and follow its collection status.</span></div><a th:href="@{/donor/donations/new}" class="btn btn-green">+ Add Donation</a></div>
<div th:replace="~{fragments/layout :: alerts}"></div>
<div class="top"><form method="get"><input name="q" th:value="${q}" placeholder="Search donations..."></form><div class="tabs"><a th:href="@{/donor/donations}" th:classappend="${#strings.isEmpty(status)}?'on'">All</a><a th:href="@{/donor/donations(status='DRAFT')}" th:classappend="${status=='DRAFT'}?'on'">Drafts</a><a th:href="@{/donor/donations(status='AVAILABLE')}" th:classappend="${status=='AVAILABLE'}?'on'">Available</a><a th:href="@{/donor/donations(status='CLAIMED')}" th:classappend="${status=='CLAIMED'}?'on'">Requested</a><a th:href="@{/donor/donations(status='COMPLETED')}" th:classappend="${status=='COMPLETED'}?'on'">Completed</a></div></div>
<div class="card tablewrap"><table><tr><th>Donation</th><th>Quantity</th><th>Pickup location</th><th>Deadline</th><th>Status</th><th></th></tr>
<tr th:each="d:${donations}"><td th:text="${d.foodName}"></td><td th:text="${d.quantity+' '+d.unit}"></td><td th:text="${d.pickupLocation}"></td><td th:text="${#temporals.format(d.bestBefore,'dd MMM, hh:mm a')}"></td><td><span th:replace="~{fragments/layout :: badge(${d.status.name()})}"></span></td><td><a class="btn" th:href="@{/donor/donations/{id}(id=${d.id})}">View</a></td></tr></table></div></main></div></body></html>
