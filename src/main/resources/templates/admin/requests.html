<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Requests')}"></head><body><div class="shell">
<aside th:replace="~{fragments/layout :: sidebar('req')}"></aside><main class="main"><div class="top"><div><button class="btn menu-btn">&#9776;</button><h1>Request Management</h1><span style="color:var(--muted)">Search, review, and manage platform requests.</span></div></div>
<form method="get" style="margin-bottom:14px"><input name="q" th:value="${q}" placeholder="Search requests..."></form>
<div class="card tablewrap"><table><tr><th>Request ID</th><th>Donation</th><th>Donor</th><th>Recipient</th><th>Date</th><th>Status</th></tr><tr th:each="p:${pickups}"><td th:text="${'RQ-'+#numbers.formatInteger(p.id,4)}"></td><td th:text="${p.donation.foodName}"></td><td th:text="${p.donation.donor.orgName}"></td><td th:text="${p.organization.organizationName}"></td><td th:text="${#temporals.format(p.pickupDate,'dd MMM yyyy')}"></td><td><span th:replace="~{fragments/layout :: badge(${p.status.name()})}"></span></td></tr></table></div></main></div></body></html>
