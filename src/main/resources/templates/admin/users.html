<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Users')}"></head><body><div class="shell">
<aside th:replace="~{fragments/layout :: sidebar('users')}"></aside><main class="main"><div class="top"><div><button class="btn menu-btn">&#9776;</button><h1>User Management</h1><span style="color:var(--muted)">Search, review, and manage platform users.</span></div></div>
<form method="get" style="margin-bottom:14px"><input name="q" th:value="${q}" placeholder="Search users..."></form>
<div class="card tablewrap"><table><tr><th>User</th><th>Role</th><th>Email</th><th>Phone</th><th>Joined</th></tr><tr th:each="u:${users}"><td th:text="${u.name}"></td><td th:text="${u.role}"></td><td th:text="${u.email}"></td><td th:text="${u.phone}"></td><td th:text="${#temporals.format(u.createdAt,'dd MMM yyyy')}"></td></tr></table></div></main></div></body></html>
