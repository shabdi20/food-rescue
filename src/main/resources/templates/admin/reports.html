<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Reports')}"></head><body><div class="shell">
<aside th:replace="~{fragments/layout :: sidebar('rep')}"></aside><main class="main"><div class="top"><div><button class="btn menu-btn">&#9776;</button><h1>Reports &amp; Analytics</h1><span style="color:var(--muted)">Review platform activity from live database figures.</span></div><a th:href="@{/admin/export}" class="btn btn-green">Export Report</a></div>
<div class="grid g4"><div class="card stat"><span>Units rescued</span><b th:text="${rescued}"></b></div><div class="card stat"><span>Completed collections</span><b th:text="${completed}"></b></div><div class="card stat"><span>Active donors</span><b th:text="${donors}"></b></div><div class="card stat"><span>Active NGOs</span><b th:text="${ngos}"></b></div></div><br>
<div class="grid" style="grid-template-columns:2fr 1fr"><div class="card"><h3>Monthly donation activity</h3><svg th:replace="~{fragments/charts :: line}"></svg></div><div class="card"><h3>Status distribution</h3><div th:replace="~{fragments/charts :: donut}"></div></div></div></main></div></body></html>
