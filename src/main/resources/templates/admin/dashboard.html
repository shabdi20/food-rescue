<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Admin')}"></head><body><div class="shell">
<aside th:replace="~{fragments/layout :: sidebar('dash')}"></aside><main class="main"><div class="top"><div><button class="btn menu-btn">&#9776;</button><h1>Admin Dashboard</h1><span style="color:var(--muted)">Monitor platform health, activity, and community outcomes.</span></div><a th:href="@{/admin/export}" class="btn">Export summary</a></div>
<div class="grid g4"><div class="card stat"><span>Total users</span><b th:text="${totalUsers}"></b></div><div class="card stat"><span>Active donors</span><b th:text="${donors}"></b></div><div class="card stat"><span>Registered NGOs</span><b th:text="${ngos}"></b></div><div class="card stat"><span>Total donations</span><b th:text="${totalDonations}"></b></div></div><br>
<div class="grid" style="grid-template-columns:2fr 1fr"><div class="card"><h3>Donations over time</h3><svg th:replace="~{fragments/charts :: line}"></svg></div><div class="card"><h3>Donation status</h3><div th:replace="~{fragments/charts :: donut}"></div></div></div><br>
<div class="grid g2"><div class="card"><h3>User role distribution</h3>Donors <b th:text="${pctDonors}+'%'"></b><div class="bar"><i th:style="'width:'+${pctDonors}+'%'"></i></div>NGOs <b th:text="${pctNgos}+'%'"></b><div class="bar"><i th:style="'width:'+${pctNgos}+'%'"></i></div>Admins <b th:text="${pctAdmins}+'%'"></b><div class="bar"><i th:style="'width:'+${pctAdmins}+'%'"></i></div></div>
<div class="card"><h3>Recent platform activity <a th:href="@{/admin/donations}" style="float:right;font-size:13px;color:var(--green)">View all</a></h3><div th:each="d:${recent}" class="req"><span><b th:text="${d.foodName}"></b><br><small th:text="${d.donor.orgName}"></small></span><span th:replace="~{fragments/layout :: badge(${d.status.name()})}"></span></div></div></div></main></div></body></html>
