<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Donations')}"></head><body><div class="shell">
<aside th:replace="~{fragments/layout :: sidebar('don')}"></aside><main class="main"><div class="top"><div><button class="btn menu-btn">&#9776;</button><h1>Donation Management</h1><span style="color:var(--muted)">Search, review, and manage platform donations.</span></div></div>
<div class="top"><form method="get"><input name="q" th:value="${q}" placeholder="Search donations..."></form><div class="tabs"><a th:href="@{/admin/donations}" th:classappend="${#strings.isEmpty(status)}?'on'">All</a><a th:href="@{/admin/donations(status='AVAILABLE')}" th:classappend="${status=='AVAILABLE'}?'on'">Available</a><a th:href="@{/admin/donations(status='CLAIMED')}" th:classappend="${status=='CLAIMED'}?'on'">Claimed</a><a th:href="@{/admin/donations(status='PICKUP_SCHEDULED')}" th:classappend="${status=='PICKUP_SCHEDULED'}?'on'">Scheduled</a><a th:href="@{/admin/donations(status='COMPLETED')}" th:classappend="${status=='COMPLETED'}?'on'">Completed</a></div></div>
<div class="card tablewrap"><table><tr><th>ID</th><th>Food</th><th>Donor</th><th>Qty</th><th>Location</th><th>Status</th></tr><tr th:each="d:${donations}"><td th:text="${'FR-'+#numbers.formatInteger(d.id,5)}"></td><td th:text="${d.foodName}"></td><td th:text="${d.donor.orgName}"></td><td th:text="${d.quantity+' '+d.unit}"></td><td th:text="${d.pickupLocation}"></td><td><span th:replace="~{fragments/layout :: badge(${d.status.name()})}"></span></td></tr></table></div></main></div></body></html>
